[package]
name = "iptv-aggregator"
version = "1.0.0"
edition = "2024"
description = "Automated Multi-Source Global IPTV Aggregator for IPTVnator, VLC, MPV, Kodi"
license = "MIT"
repository = "https://github.com/Tarke4618/iptv"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "gzip", "brotli", "rustls", "stream", "cookies", "form"] }
scraper = "0.27"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
parking_lot = "0.12"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
base64 = "0.23"
urlencoding = "2.1"
# mimalloc is optional because it requires a C compiler (not available for Android cross-compilation)
mimalloc = { version = "0.1", optional = true }
async-trait = "0.1"

# Tauri dependencies for cross-platform app (optional feature)
tauri = { version = "2.0.0-beta.7", optional = true }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
tauri = ["dep:tauri"]

[lib]
name = "iptv_aggregator"
path = "src/lib.rs"

[[bin]]
name = "iptv-aggregator"
path = "src/main.rs"
required-features = []

[[bin]]
name = "iptv-app"
path = "src-tauri/src/main.rs"
required-features = ["tauri"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Optimized profile for CI builds (faster compile time)
[profile.dist]
inherits = "release"
lto = false
codegen-units = 16
opt-level = "z"