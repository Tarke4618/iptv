[package]
name = "iptv-aggregator"
version = "5.0.0"
edition = "2024"
description = "Automated Multi-Source Global IPTV Aggregator for IPTVnator, VLC, MPV, Kodi"
license = "MIT"
repository = "https://github.com/Tarke4618/iptv"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "gzip", "brotli", "rustls", "stream", "cookies"] }
scraper = "0.27"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
parking_lot = "0.12"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
base64 = "0.23"
urlencoding = "2.1"
mimalloc = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Optimized profile for CI builds (faster compile time)
[profile.dist]
inherits = "release"
lto = false
codegen-units = 16
opt-level = "z"