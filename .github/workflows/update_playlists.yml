name: Refresh IPTV M3U Playlists (Rust v5.0.0)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test run without committing changes'
        type: boolean
        default: false

concurrency:
  group: iptv-playlist-builder
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "iptv-rust-v5-${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: |
            iptv-rust-v5-

      - name: Pre-flight checks
        run: |
          jq empty config.json
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo build --profile dist
          echo "Build successful"

      - name: Build release binary
        run: |
          cargo build --release
          ls -la target/release/iptv-aggregator

      - name: Run Rust IPTV Aggregator
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting IPTV aggregator at $(date)"
          set -x
          ./target/release/iptv-aggregator --config config.json
          set +x
          echo "Aggregator completed at $(date)"

      - name: Validate playlists and generate Job Summary
        run: |
          ALL_COUNT=$(grep -c '^#EXTINF:' playlists/all.m3u 2>/dev/null || echo 0)
          TOTAL_LANGS=$(ls playlists/languages/*.m3u 2>/dev/null | grep -v _backups | wc -l)

          {
            echo "## IPTV Rust v5.0.0 Build Summary"
            echo "| Metric | Value |"
            echo "| :--- | :---: |"
            echo "| **Total Verified Channels** | ${ALL_COUNT} |"
            echo "| **Language Playlists** | ${TOTAL_LANGS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Show per-language counts
          for f in playlists/languages/*.m3u; do
            if [[ "$f" != *"_backups"* ]]; then
              LANG=$(basename "$f" .m3u)
              COUNT=$(grep -c '^#EXTINF:' "$f" 2>/dev/null || echo 0)
              if [ "$COUNT" -gt 0 ]; then
                echo "| **$LANG** | $COUNT |" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

          # Minimum channel check
          if [ "$ALL_COUNT" -lt 50 ]; then
            echo "::error::Fewer than 50 live channels found ($ALL_COUNT). Aborting commit."
            exit 1
          fi

      - name: Commit and push updated playlists
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlists/ README.md cache/ playlists/index.json
          if git diff --quiet --staged; then
            echo "No playlist changes detected."
          else
            git commit -m "Auto-update verified M3U playlists (Rust v5.0.0)"
            # Try push with retries
            for i in 1 2 3 4 5; do
              echo "Attempt $i to push..."
              git fetch origin
              if ! git diff --quiet HEAD~1..origin/main -- playlists/ README.md cache/ playlists/index.json 2>/dev/null; then
                echo "Remote has different changes, pulling..."
                git pull --rebase origin main
              fi
              if git push; then
                echo "Push successful!"
                break
              fi
              echo "Push failed, waiting ${i}0 seconds..."
              sleep $((i * 10))
            done
          fi