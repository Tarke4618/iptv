name: Refresh eja.tv M3U Playlists

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/update_playlists.yml'

concurrency:
  group: iptv-playlist-builder
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape sources and build M3U playlists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u scraper.py

      - name: Commit and push updated playlists
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlists/ README.md
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update verified M3U playlists"
            git pull --rebase origin main
            git push
          else
            echo "No playlist changes detected."
          fi
