name: Refresh eja.tv M3U Playlists

on:
  schedule:
    - cron: '0 */12 * * *' # Runs automatically every 12 hours
  workflow_dispatch:       # Allows manual 1-click refresh anytime

permissions:
  contents: write

jobs:
  build-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape eja.tv and build .m3u playlists
        run: python scraper.py

      - name: Commit and push updated playlists
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlists/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update eja.tv M3U playlists" && git push)
