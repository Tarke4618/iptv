name: Build & Release Tauri App

on:
  schedule:
    # Weekly build on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (linux, windows, android, all)'
        required: false
        default: 'all'
        type: string
        example: 'all'
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'src-tauri/**'

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: iptv-aggregator-linux-x86_64
            ext: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: iptv-aggregator-linux-x86_64-musl
            ext: ''
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: iptv-aggregator-windows-x86_64
            ext: '.exe'
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            artifact: iptv-aggregator-windows-x86_64-gnu
            ext: '.exe'
          # Android phone (ARM64)
          - target: aarch64-linux-android
            os: ubuntu-latest
            artifact: iptv-aggregator-android-phone-aarch64
            ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "tauri-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}"

      # Android-specific setup (NDK for cross-compilation)
      - name: Install Android NDK (Android)
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_VERSION="r26b"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          # Configure Cargo linker for Android cross-compilation
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "$HOME/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          ar = "$HOME/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF

      # Linux-specific setup
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libssl-dev pkg-config

      # Windows-specific setup
      - name: Setup Rust toolchain (Windows)
        if: runner.os == 'Windows'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Pre-flight checks
        run: |
          cargo fmt --check
          cargo clippy --lib --bin iptv-aggregator -- -D warnings
          cargo build --target ${{ matrix.target }} --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/iptv-aggregator${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # Only run on tag push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## IPTV Aggregator v${{ github.ref_name }}

            ### Downloads

            | Platform | Asset |
            |----------|-------|
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
      - name: Set release status
        run: |
          echo "Release ${{ github.ref_name }} created successfully"

  verify-build:
    name: Verify Build Quality
    runs-on: ubuntu-latest
    # Only run on PR
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "tauri-verify-${{ hashFiles('**/Cargo.lock') }}"

      - name: Format check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --lib --bin iptv-aggregator -- -D warnings

      - name: Build check
        run: cargo build --release

      - name: Test (if available)
        run: cargo test --all-targets --all-features || true